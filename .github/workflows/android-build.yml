name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android-apk:
    name: Generate standalone Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build standalone APK with bundled JavaScript
        run: cd android && ./gradlew assembleRelease
      - name: Prepare APK and checksum
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/Go-Back-1.0.0.apk
          sha256sum release/Go-Back-1.0.0.apk > release/SHA256SUMS.txt
          printf 'Build type: Standalone Android APK with bundled JavaScript (test signing)\nCommit: %s\nPackage: com.goback.focus\n' "$GITHUB_SHA" > release/BUILD-INFO.txt
      - name: Package complete source and debug APK
        run: |
          zip -qr Go-Back-Complete-Project.zip . \
            -x '.git/*' 'node_modules/*' 'android/*' '.expo/*' 'dist/*' 'web-build/*' 'Go-Back-Complete-Project.zip'
      - name: Upload complete project artifact
        uses: actions/upload-artifact@v4
        with:
          name: Go-Back-Complete-Project
          path: Go-Back-Complete-Project.zip
          retention-days: 14
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Go-Back-Android-Standalone-APK
          path: |
            release/Go-Back-1.0.0.apk
            release/SHA256SUMS.txt
            release/BUILD-INFO.txt
          retention-days: 14
