name: Go Back CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    name: TypeScript, tests and Expo config validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate Expo config and generate Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run unit tests
        run: npm test -- --runInBand
