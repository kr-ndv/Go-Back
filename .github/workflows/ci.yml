name: Go Back CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: go-back-ci-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript, tests and Expo config validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Expo config and generate Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Set up Java for native Android compilation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile Android release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: go-back-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

