name: Go Back CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'plugins/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'tsconfig.json'
      - 'babel.config.*'
      - 'metro.config.*'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'plugins/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'tsconfig.json'
      - 'babel.config.*'
      - 'metro.config.*'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: go-back-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: TypeScript, tests and Expo config validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo config and generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run unit tests
        run: npm test -- --runInBand
