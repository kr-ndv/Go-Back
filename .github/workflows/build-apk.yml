name: Build standalone Android APK

on:
  workflow_dispatch:
    inputs:
      run_unit_tests:
        description: Run JVM unit tests after compiling the APK
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: standalone-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Compile standalone debug APK
        id: build
        working-directory: android
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Run JVM unit tests
        id: tests
        if: ${{ inputs.run_unit_tests }}
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload standalone APK
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: go-back-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish build summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          TESTS_REQUESTED: ${{ inputs.run_unit_tests }}
        run: |
          {
            echo "## Go Back standalone APK build"
            echo "- APK compilation: ${BUILD_OUTCOME}"
            if [ "${TESTS_REQUESTED}" = "true" ]; then
              echo "- JVM unit tests: ${TEST_OUTCOME}"
            else
              echo "- JVM unit tests: skipped by request"
            fi
            echo "- Artifact: go-back-debug-apk-${GITHUB_RUN_NUMBER} (uploaded only if compilation succeeds)"
            echo "- APK type: unsigned debug APK; not a Play Store release build"
          } >> "${GITHUB_STEP_SUMMARY}"
