name: Android Standalone APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'plugins/**'
      - 'assets/**'
      - 'package.json'
      - 'app.json'
      - 'eas.json'
      - 'tsconfig.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and upload standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Build standalone APK with bundled JavaScript
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Generate SHA-256 checksum
        run: sha256sum android/app/build/outputs/apk/release/app-release.apk > android/app/build/outputs/apk/release/app-release.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Go-Back-Android-Standalone-APK
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
